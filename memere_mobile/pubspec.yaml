name: memere_mobile
description: Memere - Grade 12 University Entrance Learning Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────
  go_router: ^13.2.0

  # ── Networking ───────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── Local Storage ────────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # ── Code Generation & Utilities ──────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Functional Error Handling ────────────────────────────
  fpdart: ^1.1.0

  # ── UI & Design ──────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Video ────────────────────────────────────────────────
  video_player: ^2.8.6
  chewie: ^1.7.5
  flutter_hls_parser: any

  # ── Utilities ────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.3.0
  envied: ^0.5.4+1
  package_info_plus: ^8.0.0

  # ── Offline / Sync ───────────────────────────────────────
  workmanager: ^0.9.0+3

  # ── Notifications ────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── Payments ─────────────────────────────────────────────
  webview_flutter: ^4.8.0        # for Chapa/Telebirr WebView payment flow
  url_launcher: ^6.3.0
  flutter_pdfview: ^1.3.2
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_pdf: ^33.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ">=2.4.0 <2.4.3"
  freezed: any
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  envied_generator: ^0.5.4+1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env                        # loaded via envied — not committed to git

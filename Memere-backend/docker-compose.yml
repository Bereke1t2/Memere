services:
  postgres:
    image: postgres:15
    container_name: memere_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-memere}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-memere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: memere_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object store for local video dev (Phase 3). Production
  # uses real AWS S3 + CloudFront. Create the bucket once with `make minio-bucket`.
  minio:
    image: minio/minio:latest
    container_name: memere_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # No healthcheck: the minio/minio server image ships neither curl nor a
    # preconfigured mc alias, so the usual probes false-report "unhealthy".
    # Readiness is confirmed out-of-band by `make minio-bucket`.

  # --- Phase 6 Skill 4: full application stack (make compose-up) ---

  # migrate runs the embedded migrations once before the API boots, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: dev
    container_name: memere_migrate
    restart: on-failure
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    entrypoint: ["/migrate", "-direction", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  # api — HTTP server. Starts only after migrations have finished.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: dev
    container_name: memere_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # MinIO defaults for local dev; overridable via .env. These are IGNORED
      # when STORAGE_PROVIDER=b2 (the B2 branch uses B2_ENDPOINT, not S3_ENDPOINT).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      APP_ENV: development
      OTEL_ENDPOINT: ""
      METRICS_PORT: "9090"
    ports:
      - "${APP_PORT:-8080}:8080"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # worker — transcode + notification workers. Uses the same binary; in Skill 5
  # this becomes a separate Kubernetes Deployment with the FFmpeg-capable image.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        VERSION: local
        COMMIT: dev
    container_name: memere_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # MinIO defaults for local dev; overridable via .env. These are IGNORED
      # when STORAGE_PROVIDER=b2 (the B2 branch uses B2_ENDPOINT, not S3_ENDPOINT).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      APP_ENV: development
      APP_PORT: "8081"
      SWEEPER_ENABLED: "false"
      SUBSCRIPTION_SWEEP_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  minio_data:

# Prometheus ServiceMonitor — tells the Prometheus Operator to scrape the API
# and worker pods via their /metrics endpoint on port 9090.
# Requires: prometheus-operator CRDs installed in the cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: memere-api
  namespace: production
  labels:
    app.kubernetes.io/name: memere
    # Must match the Prometheus CR's serviceMonitorSelector.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: memere
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

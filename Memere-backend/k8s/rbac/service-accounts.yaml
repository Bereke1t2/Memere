apiVersion: v1
kind: ServiceAccount
metadata:
  name: memere-api
  namespace: production
  labels:
    app.kubernetes.io/name: memere
    app.kubernetes.io/component: api
  annotations:
    # AWS IRSA: bind to an IAM role that allows S3 GetObject/PutObject on the media bucket.
    # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/memere-api-role
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memere-worker
  namespace: production
  labels:
    app.kubernetes.io/name: memere
    app.kubernetes.io/component: worker
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/memere-worker-role
automountServiceAccountToken: false

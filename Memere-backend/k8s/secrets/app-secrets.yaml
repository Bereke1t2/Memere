# NEVER store real secret values in this file.
# This manifest is a placeholder showing the expected Secret shape.
# In production, provision via:
#   - Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
#     (kubeseal --cert <pub.pem> -o yaml < app-secrets.yaml > app-secrets-sealed.yaml)
#   - External Secrets Operator: https://external-secrets.io
#     (backed by AWS Secrets Manager / GCP Secret Manager / Vault)
#
# The fields below use the literal placeholder "CHANGE_ME" to make it obvious
# that this file must not be applied as-is.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: production
  labels:
    app.kubernetes.io/name: memere
    app.kubernetes.io/component: secrets
  annotations:
    # Annotation used by External Secrets Operator to sync from the store.
    # secrets.external-secrets.io/store: aws-secrets-manager
    # secrets.external-secrets.io/refresh-interval: "1h"
type: Opaque
stringData:
  DB_URL: "CHANGE_ME"                    # postgres://user:pass@host:5432/memere?sslmode=require
  REDIS_URL: "CHANGE_ME"                 # redis://:pass@host:6379/0
  JWT_SECRET: "CHANGE_ME"               # min 32 bytes, cryptographically random
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_S3_BUCKET: "CHANGE_ME"
  STORAGE_CDN_DOMAIN: "CHANGE_ME"       # e.g. cdn.memere.app
  STORAGE_CDN_KEY_PAIR_ID: "CHANGE_ME"
  STORAGE_CDN_PRIVATE_KEY_PEM: "CHANGE_ME"
  CHAPA_SECRET_KEY: "CHANGE_ME"
  CHAPA_WEBHOOK_SECRET: "CHANGE_ME"
  CHAPA_BASE_URL: "https://api.chapa.co/v1"
  TELEBIRR_WEBHOOK_SECRET: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"
  FCM_SERVER_KEY: "CHANGE_ME"
  SENDGRID_API_KEY: "CHANGE_ME"
  SENDGRID_FROM_EMAIL: "noreply@memere.app"
  PAYMENT_MONTHLY_PRICE: "99"           # ETB
  PAYMENT_MONTHLY_PERIOD: "720h"
  PAYMENT_ANNUAL_PRICE: "899"           # ETB
  PAYMENT_ANNUAL_PERIOD: "8760h"
  SECURITY_LOGIN_MAX_FAILURES: "5"
  SECURITY_LOGIN_LOCKOUT_TTL: "15m"

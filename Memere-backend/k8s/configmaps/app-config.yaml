apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
  labels:
    app.kubernetes.io/name: memere
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  OTEL_ENDPOINT: "http://otel-collector:4317"
  CORS_ALLOWED_ORIGINS: "https://memere.app,https://www.memere.app"
  RATE_LIMIT_RPM: "60"
  LOGIN_RATE_LIMIT: "5"
  LOGIN_RATE_WINDOW: "300s"
  BODY_LIMIT_BYTES: "1048576"
  SWEEPER_ENABLED: "true"
  SWEEPER_INTERVAL: "1m"
  SUBSCRIPTION_SWEEP_ENABLED: "true"
  ENGAGEMENT_SWEEP_ENABLED: "true"
  VIDEO_CONCURRENCY: "4"
  VIDEO_WORK_DIR: "/tmp/transcode"
  VIDEO_MAX_UPLOAD_BYTES: "2147483648"
  VIDEO_MAX_ATTEMPTS: "3"
  VIDEO_QUEUE_BUFFER: "64"
  PAYMENT_CALLBACK_URL: "https://api.memere.app/api/v1/webhooks/payments"
  PAYMENT_RETURN_URL: "https://memere.app/payment/result"
  PAYMENT_DEFAULT_CURRENCY: "ETB"
  PAYMENT_TEACHER_SHARE: "0.70"
  PAYMENT_MONTHLY_CURRENCY: "ETB"
  PAYMENT_ANNUAL_CURRENCY: "ETB"
  PAYMENT_MOCK_ENABLED: "false"
  JWT_ISSUER: "memere"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "720h"
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  DB_CONN_LIFETIME: "30m"
  STORAGE_REGION: "us-east-1"
  STORAGE_USE_PATH_STYLE: "false"
  STORAGE_UPLOAD_URL_TTL: "15m"
  STORAGE_STREAM_URL_TTL: "2h"
  STORAGE_DOWNLOAD_URL_TTL: "30m"

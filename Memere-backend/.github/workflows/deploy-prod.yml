name: deploy-prod

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/memere-api
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/memere-worker

# No concurrency cancellation for production — let it finish or fail explicitly.
concurrency:
  group: deploy-prod

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # requires manual approval via GitHub environment rule

    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}"          >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}"             >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push production-tagged images.
      - name: Build & push API image (production)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_API }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker image (production)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WORKER }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan — block release on HIGH/CRITICAL vulnerabilities.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      # -----------------------------------------------------------------------
      # Run migrations against production BEFORE rolling out the app (zero-
      # downtime expand/contract pattern — the new schema is backward-compatible
      # with the running pods so the rollout is safe).
      # -----------------------------------------------------------------------
      - name: Run migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DB_HOST="${DATABASE_URL}" \
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }} \
            /migrate -direction up

      - name: Configure kubectl (production)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

      - name: Deploy API to production
        run: |
          kubectl set image deployment/memere-api \
            api=${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }} \
            -n memere-prod
          kubectl rollout status deployment/memere-api -n memere-prod --timeout=10m

      - name: Deploy worker to production
        run: |
          kubectl set image deployment/memere-worker \
            worker=${{ env.IMAGE_WORKER }}:${{ steps.meta.outputs.version }} \
            -n memere-prod
          kubectl rollout status deployment/memere-worker -n memere-prod --timeout=10m

      # -----------------------------------------------------------------------
      # Smoke test production before marking the deploy successful.
      # -----------------------------------------------------------------------
      - name: Smoke test production
        run: |
          PROD_URL="${{ vars.PROD_URL }}"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/health")
            if [ "$status" = "200" ]; then
              echo "Production smoke test passed (attempt $i)"
              version_json=$(curl -s "${PROD_URL}/version")
              echo "Running: $version_json"
              exit 0
            fi
            echo "Attempt $i: got $status, retrying in 15s…"
            sleep 15
          done
          echo "Production smoke test FAILED — initiating rollback"
          kubectl rollout undo deployment/memere-api -n memere-prod
          kubectl rollout undo deployment/memere-worker -n memere-prod
          exit 1

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Production deploy succeeded: *${{ steps.meta.outputs.version }}* (`${{ steps.meta.outputs.commit }}`) is live."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🔥 Production deploy FAILED for *${{ steps.meta.outputs.version }}* — rollback triggered. Check the Actions log immediately."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

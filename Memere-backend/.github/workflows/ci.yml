name: ci

on:
  pull_request: {}
  push:
    branches: [main]

env:
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/memere-api
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/memere-worker

jobs:
  # -------------------------------------------------------------------------
  # test — lint, race-detector tests, security scans, sqlc drift gate
  # -------------------------------------------------------------------------
  test:
    name: Test & Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: memere
          POSTGRES_PASSWORD: memere
          POSTGRES_DB: memere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point the migrate runner and tests at the service containers.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: memere
      DB_PASSWORD: memere
      DB_NAME: memere
      DB_SSL_MODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_TEST_ADDR: localhost:6379
      JWT_SECRET: ci-test-secret-that-is-long-enough-32ch
      APP_ENV: development
      APP_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run migrations
        run: make migrate-up

      - name: Verify sqlc-generated code is current
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/repository/postgres/sqlcgen/

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

      - name: Tests (race detector + coverage)
        run: go test ./... -race -coverprofile=cover.out -covermode=atomic -timeout 120s

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: cover.out
          fail_ci_if_error: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high ./...

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # build — docker build (no push on PRs; push + Trivy on main/tags)
  # -------------------------------------------------------------------------
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}"    >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build API image (always) — push only on main branch.
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.commit }},${{ env.IMAGE_API }}:staging
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build worker image (always) — push only on main branch.
      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_WORKER }}:${{ steps.meta.outputs.commit }},${{ env.IMAGE_WORKER }}:staging
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy vulnerability scan — only when images were pushed (main branch).
      - name: Trivy scan API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.commit }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif

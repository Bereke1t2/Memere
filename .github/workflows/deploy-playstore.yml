name: Mobile CI & Google Play Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'memere_mobile/**'
      - '.github/workflows/deploy-playstore.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

# A Play upload is not safely interruptible: cancelling between the build and
# the upload can leave a version code consumed with nothing released.
concurrency:
  group: playstore-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned rather than tracking `stable`, so a Flutter release cannot change the
  # output of a release build without a commit in this repo. Keep in step with
  # the version developers run locally.
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Quality Gate & Validation
  # Ensures tests and static analysis pass before any deployment takes place
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: memere_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The secret is read through the environment rather than interpolated into
      # the script: it is a multi-line file, and pasting it inline breaks the
      # shell it lands in.
      - name: Restore / Setup environment variables (.env)
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          if [ -n "$MOBILE_ENV" ]; then
            printf '%s\n' "$MOBILE_ENV" > .env
          else
            echo "::warning::MOBILE_ENV is not set; falling back to .env.example."
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code (flutter analyze)
        run: flutter analyze

      # Golden tests render widgets to PNG and byte-compare them, so they only
      # pass where the fonts they load are installed. On a runner without those
      # fonts every glyph renders as a box and the comparison fails for reasons
      # unrelated to the code, so they are excluded here and regenerated locally.
      - name: Run unit & widget tests
        run: flutter test --exclude-tags golden

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Release Bundle & Deploy to Google Play Store
  # Runs ONLY when Job 1 (test) passes successfully
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Play Store
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: memere_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Checked before anything is built. A missing keystore does not fail the
      # Gradle build — android/app/build.gradle.kts falls back to debug signing —
      # so without this the job spends half an hour producing an AAB that Play
      # rejects, and the real cause is nowhere in the logs.
      - name: Verify release secrets are present
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in PLAY_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The committed values suit a developer machine and exceed what a GitHub
      # runner has, which surfaces as an opaque Gradle OOM rather than a clear
      # memory error.
      - name: Adjust Gradle memory for CI runner
        run: |
          sed -i 's/-Xmx8G/-Xmx3584m/g' android/gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1024m/g' android/gradle.properties

      - name: Restore production .env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          if [ -n "$MOBILE_ENV" ]; then
            printf '%s\n' "$MOBILE_ENV" > .env
          else
            echo "::warning::MOBILE_ENV is not set; the release will be built against .env.example."
            cp .env.example .env
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          # A malformed secret decodes to an empty or truncated file, which again
          # only shows up as a rejected upload much later.
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error::PLAY_KEYSTORE_BASE64 did not decode to a usable keystore."
            exit 1
          fi

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Determine version and build number
        id: versioning
        run: |
          # Read version name from pubspec.yaml (e.g. 1.0.0)
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          # Monotonically increasing build number using GitHub run number
          # (Offset by 100 to ensure it is higher than any initial manual test build)
          BUILD_OFFSET=${{ vars.PLAY_BUILD_OFFSET || '100' }}
          BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME+$BUILD_NUMBER"

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number="${{ steps.versioning.outputs.build_number }}"

      # Confirms the bundle really was signed with the upload key. The Gradle
      # fallback to debug signing is silent, and this is the last point where
      # catching it is cheap.
      - name: Verify the bundle is release-signed
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -s "$AAB" ]; then
            echo "::error::No app bundle was produced at $AAB."
            exit 1
          fi
          SIGNER=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'Owner:' || true)
          echo "Bundle signed by: ${SIGNER:-unknown}"
          if printf '%s' "$SIGNER" | grep -q 'CN=Android Debug'; then
            echo "::error::The bundle is debug-signed — Play will reject it. Check the keystore secrets."
            exit 1
          fi

      - name: Upload AAB Artifact (Backup / Debugging)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-${{ steps.versioning.outputs.build_number }}
          path: memere_mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: et.mirkuz.mobile
          releaseFiles: memere_mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          mappingFile: memere_mobile/build/app/outputs/mapping/release/mapping.txt
          changesNotSentForReview: false

      # The runner is ephemeral, but the keystore and its passwords should not
      # outlive the step that needs them — and this also runs when the build or
      # the upload failed.
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
